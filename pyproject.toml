[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-chaining"
version = "1.0.0"
description = "Universal Meta-Orchestrator & SYN-TEX Filament Thread for Multi-Class Tool Chaining"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Serhii Kupriienko", email = "serhii@kupriienko.com" }
]
keywords = [
    "tool-chaining",
    "meta-orchestrator",
    "filament-thread",
    "syn-tex",
    "ai-agents",
    "mcp",
    "workflow-mesh",
    "ai-native"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[project.scripts]
tool-chain = "tool_chaining.cli:main"

[project.urls]
Homepage = "https://github.com/skupriienko/tool-chaining"
Repository = "https://github.com/skupriienko/tool-chaining.git"
Issues = "https://github.com/skupriienko/tool-chaining/issues"
